apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-price-deployment 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flightpricepredictor 
  template:
    metadata:
      labels:
        app: flightpricepredictor 
    spec:
      containers:
      - name: flight-price-container 
        image: ankurbhatt1611/flightpricepredictor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000